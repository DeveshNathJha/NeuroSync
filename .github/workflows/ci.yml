name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries (OpenCV / audio / MediaPipe EGL & GLES)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libportaudio2 libegl1 libgles2
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Download MediaPipe models
        run: python scripts/download_models.py
      - name: Tests
        env:
          NEUROSYNC_DATA_DIR: ${{ runner.temp }}/neurosync-data
        run: pytest -q
      - name: Secret scan (no keys or session data committed)
        run: |
          ! git ls-files | grep -E '\.(key|enc|pem)$|^data/|patient'
