<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Privacy-first: the page may only talk to this local server. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' ws: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>NeuroSync</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">NeuroSync</span>
      <span class="brand-tag">session observation notes</span>
    </div>
    <nav class="app-nav" aria-label="Main">
      <ul id="nav">
        <li><a href="#/consent" data-route="consent">Consent &amp; setup</a></li>
        <li><a href="#/live" data-route="live">Live session</a></li>
        <li><a href="#/video" data-route="video">Analyse a video</a></li>
        <li><a href="#/review" data-route="review">Review</a></li>
        <li><a href="#/history" data-route="history">History</a></li>
        <li><a href="#/data" data-route="data">Data &amp; privacy</a></li>
      </ul>
    </nav>
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="status-item">Connecting…</span>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="view"></div>
  </main>

  <footer class="disclaimer" role="note" aria-label="Disclaimer">
    <p id="disclaimer"></p>
  </footer>

  <noscript><p class="noscript">NeuroSync needs JavaScript enabled in this browser.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
